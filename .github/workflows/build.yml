name: Build Astra Client

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-fix Cartesian.java generic cast
        run: |
          FILE="src/main/java/net/minecraft/util/Cartesian.java"
          if [ -f "$FILE" ]; then
            sed -i 's/(Object\[\]) Cartesian.createArray/(T[]) Cartesian.createArray/' "$FILE"
            echo "Patched: $(grep -n "Cartesian.createArray" "$FILE")"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Astra-Client-Build
          path: build/libs/
          if-no-files-found: error